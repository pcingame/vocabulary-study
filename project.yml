name: VocabularyStudy
options:
  bundleIdPrefix: com.doanthanhphuong
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: P3MPHWPJ62
targets:
  VocabularyStudy:
    type: application
    platform: iOS
    sources: [VocabularyStudy]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.doanthanhphuong.VocabularyStudy
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: Mầm
        INFOPLIST_KEY_NSCameraUsageDescription: Chụp trang sách để lấy từ vựng.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO  # chỉ dùng mã hoá của hệ thống, khỏi bị hỏi mỗi lần upload
        TARGETED_DEVICE_FAMILY: "1"  # chỉ iPhone
        OTHER_LDFLAGS: ["-weak_framework", "FoundationModels"]  # AI chỉ có từ iOS 26, máy iOS 18 vẫn mở được app
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    scheme:
      testTargets: [VocabularyStudyTests, VocabularyStudyUITests]
  VocabularyStudyTests:
    type: bundle.unit-test
    platform: iOS
    sources: [VocabularyStudyTests]
    dependencies:
      - target: VocabularyStudy
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  VocabularyStudyUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - VocabularyStudyUITests
      - path: VocabularyStudy/Resources/toeic_grammar.json  # để testFullJourney tra đáp án
        buildPhase: resources
    dependencies:
      - target: VocabularyStudy
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: VocabularyStudy
